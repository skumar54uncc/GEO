name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo
          POSTGRES_DB: geo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://geo:geo@localhost:5432/geo
      TEST_DATABASE_URL: postgres://geo:geo@localhost:5432/geo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Chromium is required by the Phase 2 crawl e2e (Crawlee/Playwright). Without this, CI
      # can finish the crawl with empty/partial pages and fail entity + js_only assertions.
      # --with-deps needs apt; fall back when Ubuntu mirrors DNS-fail (transient on runners).
      - run: npx playwright install chromium --with-deps || npx playwright install chromium
      - run: npm run db:up
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
